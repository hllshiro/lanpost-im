# Build the Orbit + minimal IPMSG spike from any branch, without merging it.
#
# The feature branch is deliberately not merged into main, so this workflow
# lives on main and checks out the branch you pass in `ref`. GitHub only lists
# a workflow_dispatch workflow that exists on the default branch, which is why
# the definition is here rather than on the feature branch.
#
# Usage
#   Actions -> "spike-orbit" -> Run workflow
#     Use workflow from: main
#     ref:               spike/orbit-ipmsg   (branch, tag or SHA)
#     run_e2e:           true                 (Windows only)
#
# Outputs are workflow artifacts only. Nothing is published to Releases.
#
# Note: `defaults.run.working-directory` applies to `run:` steps only, so
# upload-artifact paths stay relative to the repository root.

name: spike-orbit

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: true
        default: 'spike/orbit-ipmsg'
      run_e2e:
        description: 'Run Playwright E2E on Windows'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: spike-orbit-${{ inputs.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: spike/orbit/desktop

jobs:
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/orbit/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # better-sqlite3 is built for Node by npm ci; Electron 32 has a different
      # module ABI, so it has to be rebuilt or the app dies on first require.
      # `install-app-deps` is electron-builder's own subcommand, so it needs no
      # extra dependency beyond electron-builder itself.
      - name: Rebuild native modules for Electron 32
        run: npx --no-install electron-builder install-app-deps

      - name: Compile IPMSG transport
        run: npm run build:ipmsg

      - name: Unit tests (protocol, transport, files)
        run: npm run test:ipmsg

      - name: Unit test (main-process bridge)
        run: node tests/unit/ipmsg-bridge.test.js

      - name: Unit test (renderer mapping)
        run: node tests/unit/ipmsg-map.test.js

      # Runs the real better-sqlite3 build, so it must use Electron's Node.
      - name: Unit tests (migration, restart round-trip)
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          npx --no-install electron tests/unit/ipmsg-store.test.js

      - name: Package (NSIS + zip)
        run: npx --no-install electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: List artifacts
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Upload Windows artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: spike-orbit-windows-x64
          path: |
            spike/orbit/desktop/dist/*.exe
            spike/orbit/desktop/dist/*.zip
          if-no-files-found: warn

      - name: E2E (Orbit navigation + IPMSG text/file)
        if: ${{ inputs.run_e2e }}
        run: npx --no-install playwright test --reporter=line

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: spike/orbit/desktop/package-lock.json

      # fpm shells out to rpmbuild for the .rpm target.
      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron 32
        run: npx --no-install electron-builder install-app-deps

      - name: Compile IPMSG transport
        run: npm run build:ipmsg

      # No Electron-GUI tests here: the suite needs a display and the app is
      # validated on Windows. Linux jobs prove the packages build per arch.
      - name: Unit tests (protocol, transport, files, bridge, mapping)
        run: |
          npm run test:ipmsg
          node tests/unit/ipmsg-bridge.test.js
          node tests/unit/ipmsg-map.test.js

      - name: Package (AppImage, deb, rpm)
        run: npx --no-install electron-builder --linux --${{ matrix.arch }} --publish never

      - name: List artifacts
        run: ls -lh dist

      - name: Upload Linux artifacts
        if: always() && !cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: spike-orbit-linux-${{ matrix.arch }}
          path: |
            spike/orbit/desktop/dist/*.AppImage
            spike/orbit/desktop/dist/*.deb
            spike/orbit/desktop/dist/*.rpm
          if-no-files-found: warn
