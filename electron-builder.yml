appId: com.lanpost.im
productName: 内网传书
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml,pnpm-workspace.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!docs/**'
  - '!scripts/**'
  - '!.superpowers/**'
  - '!.github/**'
  - '!.worktrees/**'
  - '!.dev-data/**'
  - '!.tmp-*/**'
  - '!**/*.pcapng'
  - '!**/*.log'
asarUnpack:
  - resources/**
win:
  executableName: lanpost-im
  artifactName: ${name}-${version}-win.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: 内网传书
  uninstallDisplayName: 内网传书
  createDesktopShortcut: always
  perMachine: true
  include: build/installer.nsh
linux:
  executableName: lanpost-im
  # Name 用中文显示；桌面文件名与 WM_CLASS 仍用 ASCII，避免窗口关联失效
  syncDesktopName: true
  maintainer: hllshiro <hllshiro@users.noreply.github.com>
  category: Network
  # 架构只由命令行 --x64 / --arm64 决定。这里若再写 arch，electron-builder 会在
  # 每个任务里同时产出两种架构的安装包，发布时同名文件并发解压互相覆盖。
  target:
    - AppImage
    - deb
    - rpm
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
deb:
  artifactName: ${name}_${version}_${arch}.${ext}
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
rpm:
  artifactName: ${name}-${version}.${arch}.${ext}
  afterInstall: build/linux/after-install.sh
  afterRemove: build/linux/after-remove.sh
publish: null
npmRebuild: false
